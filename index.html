<style>
:root{--navy:#102c50;--deep:#0b2341;--gold:#b29865;--muted:#798697;--paper:#f7f6f2;--line:#e6e6e2}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 10% 12%,rgba(178,152,101,.10),transparent 34%),radial-gradient(ellipse at 92% 88%,rgba(16,44,80,.07),transparent 38%),var(--paper);font:14px system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--navy);display:grid;place-items:center;padding:20px}
.container{width:min(440px,100%);text-align:center}.mark{width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(16,44,80,.16))}.eyebrow{font:600 10px system-ui;letter-spacing:3px;color:var(--gold);margin:15px 0}h1{font:normal clamp(29px,6vw,38px) Georgia,serif;margin:0}p{line-height:1.65;color:var(--muted)}.panel{background:#fff;border:1px solid #e4e7e8;box-shadow:0 18px 56px rgba(22,43,69,.065);padding:36px 34px 32px;border-radius:22px;margin-top:26px}.label{font-size:13px;color:var(--navy);font-weight:600}.pins{display:flex;justify-content:center;gap:12px;margin:22px auto 20px}.pins span{width:50px;height:56px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--line);background:#fafaf8;transition:.2s;color:var(--gold);font-size:20px}.pins span.filled{border-color:var(--gold);background:#f9f6ef;transform:translateY(-1px)}.secret{position:absolute;left:50%;width:1px;height:1px;opacity:0;pointer-events:none}button{border:none;cursor:pointer;border-radius:9px;background:var(--navy);color:white;font:600 14px system-ui;padding:14px 18px;width:100%;transition:transform .2s,box-shadow .2s}button:hover{background:var(--deep);box-shadow:0 7px 18px rgba(16,44,80,.18);transform:translateY(-1px)}button:focus-visible,.pins:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.message{min-height:22px;color:#bd5048;font-size:12px;margin:15px auto 0}.sub{font-size:12px;line-height:1.55;color:#8d99a5;margin-top:21px}.foot{font-size:11px;margin-top:25px;letter-spacing:.8px;color:#9aa4ae}.panel.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:500px){.panel{padding:29px 22px}.pins{gap:8px}.pins span{width:47px}}

 <h1>Controle financeiro</h1>
 <p>Uma visão organizada dos pagamentos do Instituto.</p>
 <div class="panel" id="panel">
  <div class="label">Insira seu PIN de acesso</div>
  <div class="pins" id="pins" role="button" tabindex="0" aria-label="Campo de código de quatro dígitos"><span>—</span><span>—</span><span>—</span><span>—</span></div>
  <input class="secret" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" aria-label="PIN de quatro dígitos">
  <button id="enter" type="button">Entrar no financeiro →</button>
  <div class="message" role="alert" id="message"></div>
  <div class="sub">Acesso à planilha protegido pela sua conta Google.<br>O painel abrirá nesta mesma aba, sem janela auxiliar.</div>
 </div>
 <div class="foot">MEDICAL FINANCIAL MANAGEMENT · 2026</div>
</div>
<script>
'use strict';
const PIN='0002'; // Barreira visual apenas. Não protege o backend.
const DEST='https://script.google.com/macros/s/AKfycbygCTlIZZcO0jHKygV_U1q2rQmIwvr8OqclN2pttj-R0VrsfZJIsZpKBZb0MCxdWmr1dg/exec';
const input=document.getElementById('pin'),dots=[...document.querySelectorAll('#pins span')];
const focusPin=()=>input.focus();
document.getElementById('pins').onclick=focusPin;
document.getElementById('pins').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();focusPin()}};
function paint(){let v=input.value.replace(/\D/g,'').slice(0,4);if(input.value!==v)input.value=v;dots.forEach((d,i)=>{d.textContent=i<v.length?'●':'—';d.classList.toggle('filled',i<v.length)});document.getElementById('message').textContent='';if(v.length===4) setTimeout(()=>{if(input.value===v)enter()},130)}
function enter(){const v=input.value;if(v!==PIN){document.getElementById('panel').classList.remove('shake');void document.getElementById('panel').offsetWidth;document.getElementById('panel').classList.add('shake');input.value='';paint();document.getElementById('message').textContent='PIN incorreto. Tente novamente.';focusPin();return}document.getElementById('enter').disabled=true;document.getElementById('message').style.color='#287b68';document.getElementById('message').textContent='Acessando o financeiro…';window.location.assign(DEST)}
input.addEventListener('input',paint);input.addEventListener('keydown',e=>{if(e.key==='Enter')enter()});document.getElementById('enter').onclick=enter;
window.addEventListener('load',()=>focusPin());
</script></body></html>
